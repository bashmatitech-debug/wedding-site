<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login</title>
<style>
body{font-family:sans-serif;max-width:400px;margin:30px auto;padding:0 16px}
input,button{width:100%;padding:12px;margin:8px 0;font-size:16px;box-sizing:border-box}
#msg{color:#b00}
</style>
</head>
<body>
<h2>Welcome back</h2>
<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button onclick="login()">Log in</button>
<p id="msg"></p>
<p>New here? <a href="register.html">Register</a></p>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
async function login(){
  const email=document.getElementById("email").value.trim();
  const password=document.getElementById("password").value;
  const {error}=await db.auth.signInWithPassword({email,password});
  if(error){document.getElementById("msg").textContent=error.message;return;}
  window.location="wishes.html";
}
</script>
</body>
</html>
