<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Abdullahi &amp; Nafisa</title>
<link rel="stylesheet" href="style.css">
<style>
body{background:none;border-radius:0;margin:0;padding:0;width:100%;color:#fff;font-family:Georgia,serif;text-align:center;text-shadow:0 2px 8px rgba(0,0,0,.6)}
.hero{padding:60px 20px 40px;max-width:480px;margin:0 auto}
.small{letter-spacing:3px;font-size:.85rem;text-transform:uppercase}
h1{font-size:2rem;margin:18px 0;line-height:1.3}
h1 span{display:block;font-size:1.4rem;margin:8px 0}
.date{font-size:1.2rem;margin:10px 0}
#count{font-size:1.1rem;margin:6px 0 30px}
a.btn{display:block;padding:14px;margin:12px 20px;border-radius:10px;text-decoration:none;font-size:1.05rem;font-family:sans-serif;text-shadow:none}
.primary{background:#b5651d;color:#fff}
.secondary{background:rgba(255,255,255,.92);color:#b5651d}
.note{font-family:sans-serif;font-size:.95rem;margin-top:30px;line-height:1.6}
</style>
</head>
<body>
<div class="hero">
  <div class="small">Join us as we celebrate</div>
  <h1>Abdullahi Shehu (Siniya)<span>&amp;</span>Nafisa Hassan Jibril</h1>
  <div class="date">Saturday, 9 January 2027</div>
  <div id="count"></div>
  <a class="btn primary" href="register.html">Register</a>
  <a class="btn secondary" href="login.html">Log in</a>
  <div class="note">Leave a wish, tell us where you're from,<br>and share your photos and videos.</div>
</div>
<script>
var days=Math.ceil((new Date(2027,0,9)-new Date())/86400000);
document.getElementById("count").textContent=days>0?days+" days to go":(days===0?"Today is the day!":"Thank you for celebrating with us");
</script>
</body>
</html>
