<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Abdullahi &amp; Nafisa</title>
<link rel="stylesheet" href="style.css">
<style>
html{background:#0a1747}
body{background:none;border-radius:0;margin:0;padding:0;width:100%;color:#fff;font-family:Georgia,serif;text-align:center}
.wrap{max-width:480px;margin:0 auto;padding:20px 16px 40px}
.flyer{width:100%;display:block;border-radius:14px;border:2px solid #c9a24a;box-shadow:0 6px 20px rgba(0,0,0,.5)}
.date{font-size:1.15rem;margin:22px 0 4px}
#count{font-size:1.05rem;color:#e8d08a;margin:0 0 24px}
a.btn{display:block;padding:14px;margin:12px 0;border-radius:10px;text-decoration:none;font-size:1.05rem;font-family:sans-serif}
.primary{background:#c9a24a;color:#0a1747;font-weight:bold}
.secondary{background:transparent;color:#e8d08a;border:2px solid #c9a24a}
.note{font-family:sans-serif;font-size:.95rem;margin-top:26px;line-height:1.6;color:#d8dcf0}
</style>
</head>
<body>
<div class="wrap">
  <img class="flyer" src="bg.jpg" alt="Wedding invitation of Abdullahi and Nafisa">
  <div class="date">Saturday, 9 January 2027</div>
  <div id="count"></div>
  <a class="btn primary" href="register.html">Register</a>
  <a class="btn secondary" href="login.html">Log in</a>
  <div class="note">Leave a wish, tell us where you're from,<br>and share your photos and videos.</div>
</div>
<script>
var days=Math.ceil((new Date(2027,0,9)-new Date())/86400000);
document.getElementById("count").textContent=days>0?days+" days to go":(days===0?"Today is the day!":"Thank you for celebrating with us");
</script>
</body>
</html>
